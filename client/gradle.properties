# 启用 AndroidX。Compose、Activity Compose 等现代 Android 依赖都基于 AndroidX。
android.useAndroidX=true

# 让旧 support library 依赖自动迁移到 AndroidX；当前项目主要是预防第三方库间接依赖。
android.enableJetifier=true

# 给 Gradle 构建进程更多内存，避免 Android Studio 同步或编译 Compose 时内存不足。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 使用 Android 官方推荐的非传递 R 类，减少资源编译体积。
android.nonTransitiveRClass=true
